[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scenariolab"
version = "0.1.0"
description = "Scenario-based safety testing for highway driving planners"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scenariolab = "scenariolab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scenariolab = ["report_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
